<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#cef5ff">
    <meta name="description" content="Kilmedt 的个人网站：文章、项目、图片与音乐。">
    <title>Kilmedt's Website</title>

    <link rel="icon" href="favicons/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="16x16" href="favicons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="favicons/android-chrome-192x192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicons/apple-touch-icon.png">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header class="app-header">
        <a class="brand" href="index.html">
            <span class="brand__mark" aria-hidden="true"></span>
            <span>Kilmedt<span class="brand__suffix">'s Website</span></span>
        </a>
        <nav class="app-nav" aria-label="主导航">
            <a href="index.html" aria-current="page">首页</a>
            <a href="projects/projects.html">Projects</a>
            <a href="gallery/gallery.html">Imgs</a>
        </nav>
    </header>

    <div class="app-body">
        <aside class="profile">
            <picture class="profile__avatar">
                <source srcset="img/avatar-256.webp" type="image/webp">
                <img src="img/avatar-256.png" alt="Kilmedt 的头像" width="256" height="256" decoding="async">
            </picture>

            <div class="profile__intro">
                <h1 class="profile__name">Kilmedt</h1>
                <p class="profile__tagline">"kilmedt的website"</p>
                <p class="profile__email"><a href="mailto:kilmedt@163.com">kilmedt@163.com</a></p>
            </div>

            <nav class="profile__links" aria-label="社交链接">
                <a href="https://space.bilibili.com/87122588" target="_blank" rel="noopener noreferrer">
                    <img src="img/bilibili_icon.png" alt="Bilibili" width="200" height="200">
                </a>
                <a href="https://github.com/Kilmedt" target="_blank" rel="noopener noreferrer">
                    <img src="img/github_icon.png" alt="GitHub" width="200" height="200">
                </a>
            </nav>
        </aside>

        <main class="tiles">
            <article class="tile">
                <div class="tile__cover">
                    <picture>
                        <source srcset="img/articles-800.webp" type="image/webp">
                        <img src="img/articles-800.jpg" alt="" width="800" height="800" loading="lazy"
                            decoding="async">
                    </picture>
                </div>
                <div class="tile__body">
                    <h2 class="tile__title">Articles</h2>
                    <span class="chip">即将上线</span>
                </div>
            </article>

            <a class="tile" href="projects/projects.html">
                <div class="tile__cover">
                    <picture>
                        <source srcset="img/projects-800.webp" type="image/webp">
                        <img src="img/projects-800.jpg" alt="" width="800" height="800" loading="lazy"
                            decoding="async">
                    </picture>
                </div>
                <div class="tile__body">
                    <h2 class="tile__title">Projects</h2>
                    <span class="tile__meta">查看<span class="tile__arrow" aria-hidden="true">→</span></span>
                </div>
            </a>

            <a class="tile" href="gallery/gallery.html">
                <!-- 封面由 tools/build_gallery.py 维护，始终指向画廊里最新的一张 -->
                <div class="tile__cover">
                    <picture>
                        <source srcset="img/gallery/cover-thumb.webp" type="image/webp">
                        <img src="img/gallery/cover-thumb.jpg" alt="" loading="lazy" decoding="async">
                    </picture>
                </div>
                <div class="tile__body">
                    <h2 class="tile__title">Imgs</h2>
                    <span class="tile__meta">查看<span class="tile__arrow" aria-hidden="true">→</span></span>
                </div>
            </a>

            <article class="tile">
                <div class="tile__cover tile__cover--lilac">
                    <div class="tile__icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 18V5.5l10-2V16" />
                            <circle cx="6" cy="18" r="3" />
                            <circle cx="16" cy="16" r="3" />
                        </svg>
                    </div>
                </div>
                <div class="tile__body">
                    <h2 class="tile__title">Music</h2>
                    <span class="chip">即将上线</span>
                </div>
            </article>

            <div class="tile tile--empty" aria-hidden="true">
                <span class="tile__plus">+</span>
                <span>待添加</span>
            </div>

            <div class="tile tile--empty" aria-hidden="true">
                <span class="tile__plus">+</span>
                <span>待添加</span>
            </div>
        </main>
    </div>

    <footer class="app-footer">
        <p>© 2026 Kilmedt</p>
    </footer>
</body>

</html>
